name: 'Anchor Test'
description: 'Build the programs as SBPFv3 and run the test suite.'
branding:
  icon: anchor
  color: blue
inputs:
  node-version:
    description: 'Version of node.js to use'
    required: false
    default: '24.22.1'
  solana-cli-version:
    description: 'Version of the Agave CLI to use'
    required: false
    default: '4.3.0'
  anchor-version:
    description: 'Version of the Anchor CLI to use'
    required: false
    default: '0.32.2'
  features:
    description: 'Features to pass to cargo'
    required: false
    default: 'default'
runs:
  using: 'composite'
  steps:
    - uses: ./.github/actions/setup-toolchain
      with:
        node-version: ${{ inputs.node-version }}
        solana-cli-version: ${{ inputs.solana-cli-version }}
        anchor-version: ${{ inputs.anchor-version }}
    - name: Cache node_modules
      uses: actions/cache@v4
      with:
        path: ./node_modules/
        key: node-modules-${{ runner.os }}-build-${{ inputs.node-version }}-${{ hashFiles('yarn.lock') }}
    - name: Install node_modules
      run: yarn
      shell: bash
    - name: Create keypair
      run: solana-keygen new --no-bip39-passphrase
      shell: bash
    - name: Cache Cargo dependencies
      uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
    - name: Build programs
      run: anchor build -- --features ${{ inputs.features }}
      shell: bash
    - name: Run tests
      run: anchor test --skip-build
      shell: bash
