name: anchor-test
on:
  push:
    branches:
      - develop
      - production
  pull_request:

jobs:
  run-anchor-test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v3
      - uses: metadaoproject/anchor-test@v2.3
        with:
            anchor-version: '0.29.0'
            solana-cli-version: '1.17.16'
            
