name: Deploy Buffer

permissions:
  contents: read

env:
  HUSKY: 0

on:
  workflow_dispatch:
    inputs:
      program_name:
        description: 'Program name'
        required: true
        type: string
      program_id:
        description: 'Program ID'
        required: true
        type: string
      rpc_url:
        description: 'RPC URL'
        required: true
        type: string


jobs:
  deploy-buffer:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: metadaoproject/setup-anchor@7d1e9699eb18c33ba5f32f6a9952f0e90515996a # v3.2
        with:
          solana-cli-version: '1.17.16'
          anchor-version: '0.29.0'
      - run: echo "$DEPLOYER_KEYPAIR" > deployer-keypair.json && chmod 600 deployer-keypair.json
        shell: bash
        env:
          DEPLOYER_KEYPAIR: ${{ secrets.DEPLOYER_KEYPAIR }}
      - run: solana-keygen new -s -o buffer-keypair --no-bip39-passphrase
        shell: bash
      - name: Deploy Buffer
        uses: nick-fields/retry@ce71cc2ab81d554ebbe88c79ab5975992d79ba08 # v3
        with:
          timeout_minutes: 30
          max_attempts: 10
          shell: bash
          command: solana program write-buffer --max-sign-attempts 50 --with-compute-unit-price 100 --use-rpc --buffer ./buffer-keypair ./verifiable-builds/${{ inputs.program_name }}.so -u $NETWORK