name: Deploy Buffer

permissions:
  contents: read

env:
  HUSKY: 0

on:
  workflow_dispatch:
    inputs:
      program_name:
        description: 'Program name'
        required: true
        type: string
      program_id:
        description: 'Program ID'
        required: true
        type: string
      network:
        description: 'Network whose deployer keypair pays for the buffer'
        required: true
        type: choice
        options:
          - devnet
          - mainnet
        default: 'devnet'
      rpc_url:
        description: 'RPC URL'
        required: true
        type: string


jobs:
  deploy-buffer:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-toolchain
        with:
          solana-cli-version: '4.3.0'
          anchor-version: '0.32.2'
          node-version: '20.18.0'
      - run: echo "$DEPLOYER_KEYPAIR" > deployer-keypair.json && chmod 600 deployer-keypair.json
        shell: bash
        env:
          DEPLOYER_KEYPAIR: ${{ inputs.network == 'mainnet' && secrets.MAINNET_DEPLOYER_KEYPAIR || secrets.DEVNET_DEPLOYER_KEYPAIR }}
      - run: solana-keygen new -s -o buffer-keypair --no-bip39-passphrase
        shell: bash
      - name: Deploy Buffer
        uses: nick-fields/retry@ce71cc2ab81d554ebbe88c79ab5975992d79ba08 # v3
        with:
          timeout_minutes: 30
          max_attempts: 10
          shell: bash
          command: solana program write-buffer --max-sign-attempts 50 --with-compute-unit-price 100 --use-rpc -k ./deployer-keypair.json --buffer ./buffer-keypair ./verifiable-builds/${{ inputs.program_name }}.so -u ${{ inputs.rpc_url }}
      - name: Remove deployer keypair
        if: always()
        run: rm -f deployer-keypair.json
        shell: bash
