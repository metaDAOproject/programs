name: Verify Build

permissions:
  contents: read

env:
  HUSKY: 0

on:
  workflow_dispatch:
    inputs:
      program_name:
        description: 'Program name'
        required: true
        type: string
      program_id:
        description: 'Program ID'
        required: true
        type: string
      anchor-version:
        description: 'Anchor version'
        required: true
        default: '0.32.2'
      solana-cli-version:
        description: 'Solana CLI version'
        required: true
        default: '4.3.0'
      features:
        description: 'Build features'
        required: true
        type: choice
        options:
          - none
          - production
          - devnet
        default: 'production'

jobs:
  verify-build:
    runs-on: ubuntu-22.04
    env:
      SOLANA_VERIFY_VERSION: "0.5.2"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-toolchain
        with:
          anchor-version: ${{ inputs.anchor-version }}
          solana-cli-version: ${{ inputs.solana-cli-version }}
      - name: Cache Cargo registry + index
        uses: actions/cache@v4
        id: cache-cargo-registry
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: cargo-${{ runner.os }}-v0001-${{ hashFiles('**/Cargo.lock') }}
      - name: Cache Solana Verify
        uses: actions/cache@v4
        id: cache-solana-verify
        with:
          path: |
            ~/.cargo/bin/solana-verify
          key: solana-verify-${{ runner.os }}-${{ env.SOLANA_VERIFY_VERSION }}
      - run: cargo install solana-verify --version ${{ env.SOLANA_VERIFY_VERSION }} --locked
        if: steps.cache-solana-verify.outputs.cache-hit != 'true'
        shell: bash
      # The deployed artifacts are SBPFv3, so the rebuild must pass --arch v3 to reproduce them.
      - name: Verify build
        run: |
          if [ "${{ inputs.features }}" = "none" ]; then
            solana-verify verify-from-repo --remote -um --arch v3 --program-id ${{ inputs.program_id }} https://github.com/${{ github.repository }} --library-name ${{ inputs.program_name }}
          else
            solana-verify verify-from-repo --remote -um --arch v3 --program-id ${{ inputs.program_id }} https://github.com/${{ github.repository }} --library-name ${{ inputs.program_name }} -- --features ${{ inputs.features }}
          fi
