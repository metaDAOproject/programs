name: generate-verifiable-builds
on:
  workflow_dispatch:
  push:
    branches:
      - production
      - develop

# Jobs commit the verifiable-build .so files back to the branch via
# EndBug/add-and-commit, so they need write access to repository contents.
permissions:
  contents: write

env:
  HUSKY: 0
  SOLANA_VERIFY_VERSION: "0.5.2"

jobs:
  generate-verifiable:
    name: generate-verifiable-${{ matrix.program }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        program:
          - futarchy
          - conditional_vault
          - launchpad
          - price_based_performance_package
          - launchpad_v7
          - bid_wall
          - liquidation
          - mint_governor
          - performance_package_v2
          - launchpad_v8
          - gated_mint
    steps:
      - uses: actions/checkout@v4
      - name: Cache solana-verify
        uses: actions/cache@v4
        id: cache-solana-verify
        with:
          path: ~/.cargo/bin/solana-verify
          key: solana-verify-${{ runner.os }}-${{ env.SOLANA_VERIFY_VERSION }}
      - name: Install solana-verify
        if: steps.cache-solana-verify.outputs.cache-hit != 'true'
        run: cargo install solana-verify --version ${{ env.SOLANA_VERIFY_VERSION }} --locked
      # The build image comes from [workspace.metadata.cli] in Cargo.toml; --arch v3 makes that image's cargo-build-sbf emit SBPFv3.
      - name: Build verifiable artifact
        run: solana-verify build --library-name ${{ matrix.program }} --arch v3 -- --features production
      - name: Print artifact hash
        run: solana-verify get-executable-hash target/deploy/${{ matrix.program }}.so
      - run: 'git pull --rebase'
      - run: cp target/deploy/${{ matrix.program }}.so ./verifiable-builds
      - name: Commit verifiable build back to mainline
        uses: EndBug/add-and-commit@a94899bca583c204427a224a7af87c02f9b325d5 # v9.1.4
        with:
          default_author: github_actions
          message: 'Update ${{ matrix.program }} verifiable build'
