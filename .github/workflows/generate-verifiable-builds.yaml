name: generate-verifiable-builds
on:
  workflow_dispatch:
  push:
    branches:
      - production
      - develop

# Jobs commit the verifiable-build .so files back to the branch via
# EndBug/add-and-commit, so they need write access to repository contents.
permissions:
  contents: write

env:
  HUSKY: 0

jobs:
  generate-verifiable-futarchy:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: metadaoproject/anchor-verifiable-build@6d8fc1999ea4b7ff701e8b166903b398741e1c50 # v0.4
        with:
          program: futarchy
          anchor-version: '0.29.0'
          solana-cli-version: '1.17.31'
          features: 'production'
      - run: 'git pull --rebase'
      - run: cp target/deploy/futarchy.so ./verifiable-builds
      - name: Commit verifiable build back to mainline
        uses: EndBug/add-and-commit@a94899bca583c204427a224a7af87c02f9b325d5 # v9.1.4
        with:
          default_author: github_actions
          message: 'Update futarchy verifiable build'
  generate-verifiable-conditional-vault:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: metadaoproject/anchor-verifiable-build@6d8fc1999ea4b7ff701e8b166903b398741e1c50 # v0.4
        with:
          program: conditional_vault
          anchor-version: '0.29.0'
          solana-cli-version: '1.17.31'
