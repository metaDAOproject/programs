[workspace]
members = [
    "programs/*"
]
exclude = [
    "jup-sdk",
    "programs/launchpad" # This is just a symlink to the latest launchpad program (currently launchpad_v7)
]
resolver = "2"

[workspace.metadata.cli]
solana = "4.3.0"

# Pins the platform-tools compiler that cargo-build-sbf uses.
[workspace.metadata.solana]
tools-version = "v1.57"

# Anchor's macros expand to code guarded by these cfgs; declare them so rustc does not flag every expansion.
[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(target_os, values("solana"))',
    'cfg(feature, values("anchor-debug", "custom-heap", "custom-panic"))',
] }

# The upstream crate lacks the `idl-build` feature the IDL build needs; this fork adds it.
[patch."https://github.com/Squads-Protocol/v4"]
squads-multisig-program = { git = "https://github.com/metapileks/squads-v4", rev = "d7fbfab3b2b218bf71bab8d7127574a88b468c17" }

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
