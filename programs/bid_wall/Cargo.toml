[package]
name = "bid_wall"
version = "0.1.0"
description = "Created with Anchor"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "bid_wall"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = { version = "0.29.0", features = ["event-cpi", "init-if-needed"] }
anchor-spl = { version = "0.29.0", features = ["metadata"] }
solana-security-txt = "1.1.1"
futarchy = { path = "../futarchy", features = ["cpi"] }
bytemuck = { version = "1.20.0"}
static_assertions = "1.1.0"
ruint = "1.3.0"
damm_v2_cpi = { path = "../damm_v2_cpi", features = ["cpi"] }