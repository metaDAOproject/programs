[package]
name = "bid_wall"
version = "0.7.0"
description = "A big wall of cash sitting at NAV, ready to take tokens from weak hands and burn them."
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "bid_wall"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
production = []

[dependencies]
anchor-lang = { version = "=0.29.0", features = ["event-cpi", "init-if-needed"] }
anchor-spl = "=0.29.0"
solana-security-txt = "=1.1.1"
