[package]
name = "mint_governor"
version = "0.7.0"
description = "Created with Anchor"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "mint_governor"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
default = []
production = []

[dependencies]
anchor-lang = { version = "=0.32.2", features = ["init-if-needed", "event-cpi"] }
anchor-spl = "=0.32.2"
solana-security-txt = "=1.1.1"

[lints]
workspace = true
