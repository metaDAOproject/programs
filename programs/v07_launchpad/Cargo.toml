[package]
name = "launchpad_v7"
version = "0.7.0"
description = "Created with Anchor"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "launchpad_v7"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
idl-build = [
    "anchor-lang/idl-build",
    "anchor-spl/idl-build",
    "futarchy/idl-build",
    "price_based_performance_package/idl-build",
    "damm_v2_cpi/idl-build",
    "bid_wall/idl-build",
    "squads-multisig-program/idl-build",
]
default = ["custom-heap"]
devnet = []
production = []
custom-heap = []

[dependencies]
anchor-lang = "=0.32.2"
anchor-spl = "=0.32.2"
futarchy = { path = "../futarchy", features = ["cpi"] }
price_based_performance_package = { path = "../price_based_performance_package", features = ["cpi"] }
solana-security-txt = "=1.1.1"
squads-multisig-program = { git = "https://github.com/Squads-Protocol/v4", package = "squads-multisig-program", rev = "af94153ff77a28b6effe46b9c94baaa93742b48c", features = ["cpi"] }
damm_v2_cpi = { path = "../damm_v2_cpi", features = ["cpi"] }
bid_wall = { path = "../bid_wall", features = ["cpi"] }

[lints]
workspace = true
