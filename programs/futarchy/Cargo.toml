[package]
name = "futarchy"
version = "0.6.2"
description = "SVM-based program for running futarchy"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "futarchy"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
idl-build = [
    "anchor-lang/idl-build",
    "anchor-spl/idl-build",
    "conditional_vault/idl-build",
    "damm_v2_cpi/idl-build",
    "mint_governor/idl-build",
    "squads-multisig-program/idl-build",
]
default = []
production = []

[dependencies]
anchor-lang = "=0.32.2"
anchor-spl = "=0.32.2"
solana-security-txt = "=1.1.1"
spl-memo = { version = "=6.0.0", features = ["no-entrypoint"] }
solana-address-lookup-table-interface = { version = "=2.2.2", features = ["bincode", "bytemuck"] }
conditional_vault = { path = "../conditional_vault", features = ["cpi"] }
squads-multisig-program = { git = "https://github.com/Squads-Protocol/v4", package = "squads-multisig-program", rev = "af94153ff77a28b6effe46b9c94baaa93742b48c", features = ["cpi"] }
damm_v2_cpi = { path = "../damm_v2_cpi", features = ["cpi"] }
mint_governor = { path = "../mint_governor", features = ["cpi"] }

[lints]
workspace = true
