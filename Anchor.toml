[toolchain]

[features]
seeds = false
skip-lint = false

[programs.localnet]
amm = "AMMJdEiCCa8mdugg6JPF7gFirmmxisTfDJoSNSUi5zDJ"
autocrat = "auToUr3CQza3D4qreT6Std2MTomfzvrEeCC5qh7ivW5"
autocrat_migrator = "MigRDW6uxyNMDBD8fX2njCRyJC4YZk2Rx9pDUZiAESt"
conditional_vault = "VLTX1ishMBbcX3rdBWGssxawAo1Q2X2qxYFYqiGodVg"
shared_liquidity_manager = "EoJc1PYxZbnCjszampLcwJGYcB5Md47jM4oSQacRtD4d"
launchpad = "mooNhciQJi1LqHDmse2JPic2NqG2PXCanbE3ZYzP3qA"
optimistic_timelock = "tiME1hz9F5C5ZecbvE5z6Msjy8PKfTqo1UuRYXfndKF"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "Localnet"
wallet = "~/.config/solana/id.json"

[scripts]
add-v03-metadata = "yarn run tsx scripts/addV03Metadata.ts"
add-v04-metadata = "yarn run tsx scripts/addV04Metadata.ts"
create-proposal = "yarn run tsx scripts/v0.5/createProposal.ts"
create-v04-dao = "yarn run tsx scripts/createV04DAO.ts"
assign-permissionless-account = "yarn run tsx scripts/assignPermissionlessAccount.ts"
create-v04-proposal = "yarn run tsx scripts/createV04Proposal.ts"
initialize-launch = "yarn run tsx scripts/initializeLaunch.ts"
test = "npx mocha --import=tsx --bail tests/main.test.ts"
transfer = "yarn run tsx scripts/v0.5/createV05TransferProposal.ts"
update-spending-limit = "yarn run tsx scripts/v0.5/updateV05SpendingLimit.ts"
execute-v05-proposal = "yarn run tsx scripts/v0.5/executeV05Proposal.ts"
use-spending-limit = "yarn run tsx scripts/v0.5/useSpendingLimit.ts"

[test]
startup_wait = 5000
shutdown_wait = 2000
upgradeable = false

